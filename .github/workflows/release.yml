name: Build and release AAR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to build and release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.cache/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg-binary
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify tagged checkout
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Release tag must start with v and contain only letters, numbers, dots, underscores, and hyphens." >&2
            exit 1
          fi
          if ! git tag --points-at HEAD | grep -Fx -- "$RELEASE_TAG"; then
            echo "Checked-out commit is not tagged $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf autoconf-archive automake build-essential cmake curl libtool libtool-bin nasm ninja-build pkg-config python3-pkg-resources swig unzip zip

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager "platforms;android-36" "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Read vcpkg baseline
        id: vcpkg
        run: |
          baseline="$(sed -n 's/.*"builtin-baseline"[[:space:]]*:[[:space:]]*"\([0-9a-f]*\)".*/\1/p' megasdk/vcpkg.json)"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg-binary
          key: vcpkg-android-r27b-${{ steps.vcpkg.outputs.baseline }}

      - name: Build release AAR
        run: ./scripts/build-aar.sh --stacktrace

      - name: Prepare release assets
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          cp mega-sdk/build/outputs/aar/mega-sdk-release.aar "dist/mega-sdk-${version}.aar"
          cd dist
          sha256sum "mega-sdk-${version}.aar" > "mega-sdk-${version}.aar.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mega-sdk-${{ env.RELEASE_TAG }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
